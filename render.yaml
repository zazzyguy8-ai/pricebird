# Render blueprint for Pricebird.
#
# The app is the whole repository, so there is no rootDir here: Render builds
# from the root and the commands below are exactly what a contributor runs.
services:
  - type: web
    name: pricebird
    runtime: node
    # Free spins the instance down after fifteen minutes idle and the next
    # visitor waits about a minute for it to wake. For a product whose traffic
    # arrives in bursts from a video, that is the difference between a signup
    # and a closed tab. Starter is the smallest plan that stays awake.
    plan: starter
    # Keep this and the Supabase project in the same region. Every page view
    # makes several round trips to Postgres, and putting the database on the
    # other side of an ocean is felt on every single one.
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # Deliberately the landing page, not /api/health: the health endpoint
    # answers 503 until Stripe and the database are configured, which is
    # correct for a human reading it and would fail the very first deploy.
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Generated by Render and never seen by anyone, which is exactly what a
      # cookie-signing key should be.
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        value: https://pricebird.org
      # sync:false means "ask me in the dashboard" - these are secrets and must
      # never be committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
